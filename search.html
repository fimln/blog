---
layout: default
title: Search
permalink: /search/
search: true
---
<form id="search-form" class="search-form" role="search">
  <div class="search-controls">
    <input id="search-input" name="q" type="search" aria-label="Search posts" aria-describedby="search-status" autocomplete="off">
    <button type="submit">Search</button>
  </div>
</form>
<p id="search-status" class="search-status" role="status" aria-live="polite"></p>
<noscript><p>Search requires JavaScript. You can still <a href="{{ '/' | relative_url }}">browse all posts</a>.</p></noscript>
<ul id="search-results" class="post-list" aria-label="Search results" data-index="{{ '/search.json' | relative_url }}"></ul>
<template id="search-result-template">
  <li>
    <article class="post-preview">
      <p class="post-meta"><time></time></p>
      <h2><a class="result-title"></a></h2>
      <p class="post-excerpt"></p>
      <a class="read-more">Read post <span aria-hidden="true">→</span></a>
    </article>
  </li>
</template>
