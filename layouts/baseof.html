<!DOCTYPE html>
<html lang="{{ .Params.contentLang | default site.Language.Locale }}">
  {{ partial "head.html" . }}
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <div class="w">
      <header class="site-header">
        <a class="site-title" href="/">{{ site.Title }}</a>
        <nav aria-label="Main navigation">
          {{ range site.Menus.main }}
            <a href="{{ .URL }}"{{ if eq $.RelPermalink .URL }} aria-current="page"{{ end }}>{{ .Name }}</a>
          {{ end }}
        </nav>
      </header>
      <main id="content" tabindex="-1">{{ block "main" . }}{{ end }}</main>
      <footer class="site-footer">
        <span>Made with ❤️ and ☕ by Alfi.</span>
        <span>Using <a href="https://gohugo.io/">hugo</a> and <a href="https://github.com/riggraz/no-style-please">no-style-please</a>.</span>
      </footer>
    </div>
  </body>
</html>
