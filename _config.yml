title: fimln Blog
tagline: Lifetime learner.
description: A place to capture my journey.
url: https://fimln.dev
baseurl: /blog
lang: en
copyright: © 2026 Alfi Maulana Akbar

# Hydejack accent + sidebar background (Anthropic warm palette)
accent_image: /assets/images/cover.jpg
accent_color: '#D97757'
theme_color: '#FAF9F5'

google_fonts: Inter:400,600,800|JetBrains+Mono:400

logo: /assets/images/logo.png

author:
  name: Alfi Maulana Akbar
  email: engelbertusrande@mail.ugm.ac.id
  about: |
    Lifetime learner. Engineering, data, and life notes.
  picture: /assets/images/logo.png
  social:
    instagram: https://www.instagram.com/alfimlnbr/
    linkedin: https://www.linkedin.com/in/fimln/
    github: fimln

# Sidebar navigation menu
menu:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: fimln.dev
    url: https://fimln.dev

# Hydejack feature flags
hydejack:
  post_addons: [related, random]
  project_addons: [about, other]
  dark_mode:
    always: false
    dynamic: true
    icon: true
  no_mark_external: true
  no_search: false
  no_drawer: false
  no_navbar: false
  no_inline_css: false
  no_break_layout: false
  no_toc: false
  no_large_headings: false
  no_structured_data: false
  no_theme_color: false
  no_breadcrumbs: true
  cookies_banner: false
  hide_dates: false
  hide_last_modified: false

# Content
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/

# Encoding and markdown
encoding: utf-8
markdown_ext: markdown,mkdown,mkdn,mkd,md
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  syntax_highlighter: rouge

sass:
  style: compressed

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-redirect-from
  - jekyll-seo-tag

# Build settings
exclude:
  - vendor
  - .bundle
  - .sass-cache
  - node_modules
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - webpack.config.js
  - improvements.md
  - run.sh
  - staticman.yml
  - LICENSE
  - NOTICE.md
  - image.md

keep_files:
  - .git
