{% assign word_count = include.post.content | strip_html | number_of_words %}
{% assign reading_time = word_count | plus: 199 | divided_by: 200 | at_least: 1 %}
<p class="post-meta"><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%d %b %Y' }}</time><span aria-hidden="true">·</span><span>{{ reading_time }} min read</span></p>
