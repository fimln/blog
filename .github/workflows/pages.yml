name: Deploy blog to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.167.0
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Hugo
        shell: bash
        run: |
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          cd "${RUNNER_TEMP}"
          curl --fail --location --retry 3 --remote-name "${release}/${archive}"
          curl --fail --location --retry 3 --remote-name "${release}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${archive}$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "${archive}" hugo
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: hugo --gc
      - run: python3 tests/site_test.py public
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
